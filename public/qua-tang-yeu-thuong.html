<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quà Tặng Yêu Thương 💝</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Dancing Script',cursive;width:100vw;height:100vh}
  #canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
  .screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .9s ease}
  .screen.active{opacity:1;pointer-events:all}
  #screen1 .big-title{font-family:'Pacifico',cursive;font-size:clamp(48px,12vw,105px);line-height:1.12;text-align:center;background:linear-gradient(135deg,#ff6eb4 0%,#ff2d9e 40%,#c92fff 70%,#9b00ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 18px #ff2d9e) drop-shadow(0 0 36px #9b00ff);animation:titlePulse 2.2s ease-in-out infinite;padding:0 24px;user-select:none}
  @keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 18px #ff2d9e) drop-shadow(0 0 36px #9b00ff)}50%{filter:drop-shadow(0 0 32px #ff2d9e) drop-shadow(0 0 65px #9b00ff)}}
  #screen1 .subtitle{margin-top:20px;font-size:clamp(13px,3.2vw,20px);color:rgba(255,255,255,.72);letter-spacing:2px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;padding:0 32px;user-select:none}
  #screen1 .tap-btn{margin-top:44px;padding:15px 46px;border:2px solid #ff2d9e;border-radius:50px;color:#fff;font-size:19px;font-family:'Dancing Script',cursive;background:rgba(255,45,158,.18);cursor:pointer;backdrop-filter:blur(8px);animation:btnGlow 1.8s ease-in-out infinite;letter-spacing:1px;transition:background .3s}
  #screen1 .tap-btn:hover{background:rgba(255,45,158,.4);transform:scale(1.04)}
  @keyframes btnGlow{0%,100%{box-shadow:0 0 14px #ff2d9e,0 0 28px rgba(255,45,158,.3)}50%{box-shadow:0 0 26px #ff2d9e,0 0 55px rgba(255,45,158,.5)}}
  .float-photo{position:fixed;border-radius:16px;overflow:hidden;border:3px solid rgba(200,80,255,.75);box-shadow:0 0 22px rgba(200,80,255,.65),0 0 45px rgba(200,80,255,.28);opacity:0;z-index:12;transition:opacity .7s ease}
  .float-photo img{width:100%;height:100%;object-fit:cover;display:block}
  #screen2 .msg-overlay{position:fixed;bottom:18%;left:50%;transform:translateX(-50%);text-align:center;z-index:20;pointer-events:none;width:90%}
  #screen2 .msg-overlay p{font-size:clamp(13px,3.4vw,20px);color:rgba(255,255,255,.9);font-family:'Playfair Display',serif;font-style:italic;letter-spacing:2px;text-shadow:0 0 14px rgba(255,45,158,.9)}
  #screen3{background:radial-gradient(ellipse at center,rgba(100,0,150,.28) 0%,transparent 70%)}
  #screen3 .love-card{background:rgba(10,0,20,.88);border:1px solid rgba(200,80,255,.4);border-radius:26px;padding:clamp(24px,5vw,48px) clamp(20px,7vw,58px);max-width:min(90vw,450px);text-align:center;backdrop-filter:blur(22px);box-shadow:0 0 60px rgba(200,80,255,.3),inset 0 0 40px rgba(200,80,255,.06);animation:cardFloat 3s ease-in-out infinite}
  @keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .heart-big{font-size:54px;display:block;margin-bottom:14px;animation:heartbeat 1.2s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  #screen3 h2{font-family:'Pacifico',cursive;font-size:clamp(22px,6vw,38px);background:linear-gradient(135deg,#ff6eb4,#c92fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
  #screen3 p{font-size:clamp(14px,3.5vw,18px);color:rgba(255,255,255,.85);line-height:1.75;font-family:'Dancing Script',cursive;margin-bottom:8px}
  .restart-btn{margin-top:26px;padding:12px 34px;border:2px solid #ff2d9e;border-radius:50px;color:#fff;font-size:16px;font-family:'Dancing Script',cursive;background:rgba(255,45,158,.2);cursor:pointer;transition:all .3s}
  .restart-btn:hover{background:rgba(255,45,158,.45)}
  #lyricBar{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:100;text-align:center;pointer-events:none;width:90%}
  #lyricBar p{font-size:clamp(12px,3vw,17px);color:rgba(255,255,255,.8);font-family:'Playfair Display',serif;font-style:italic;letter-spacing:1.5px;text-shadow:0 0 16px rgba(255,45,158,.9);transition:opacity .4s}
  .heart-particle{position:fixed;z-index:5;pointer-events:none;animation:heartRise linear forwards}
  @keyframes heartRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100vh) scale(.3)}}

  /* ===== NEW EFFECTS ===== */
  /* Soft animated gradient aura behind everything */
  #aura{position:fixed;inset:0;z-index:1;pointer-events:none;background:
      radial-gradient(circle at 20% 30%,rgba(255,45,158,.16),transparent 45%),
      radial-gradient(circle at 80% 70%,rgba(155,0,255,.16),transparent 45%),
      radial-gradient(circle at 50% 90%,rgba(255,110,180,.12),transparent 50%);
      animation:auraShift 12s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes auraShift{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.18) translateY(-3%)}}

  /* Vignette pulse */
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 240px 60px rgba(0,0,0,.85);animation:vigPulse 6s ease-in-out infinite}
  @keyframes vigPulse{0%,100%{box-shadow:inset 0 0 240px 60px rgba(0,0,0,.85)}50%{box-shadow:inset 0 0 300px 40px rgba(40,0,60,.7)}}

  /* Sweeping light beams */
  #beams{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .beam{position:absolute;top:-30%;left:50%;width:55vw;height:170vh;transform-origin:top center;
        background:linear-gradient(to bottom,rgba(255,110,180,.10),transparent 70%);filter:blur(6px);
        animation:beamSwing 9s ease-in-out infinite}
  .beam.b2{animation-duration:13s;animation-direction:reverse;background:linear-gradient(to bottom,rgba(155,0,255,.10),transparent 70%)}
  @keyframes beamSwing{0%,100%{transform:translateX(-50%) rotate(-22deg)}50%{transform:translateX(-50%) rotate(22deg)}}

  /* Falling petals */
  .petal{position:fixed;top:-40px;z-index:6;pointer-events:none;border-radius:0 100% 0 100%;
         background:linear-gradient(135deg,#ff9ed2,#ff2d9e);opacity:.85;box-shadow:0 0 8px rgba(255,45,158,.6);
         animation:petalFall linear forwards}
  @keyframes petalFall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:.9}
         100%{opacity:0;transform:translateY(110vh) translateX(80px) rotate(540deg)}}

  /* Twinkling stars */
  .twinkle{position:fixed;z-index:4;pointer-events:none;border-radius:50%;background:#fff;
           box-shadow:0 0 6px #fff,0 0 10px #ff6eb4;animation:twk ease-in-out infinite}
  @keyframes twk{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}

  /* Shooting star */
  .shoot{position:fixed;z-index:5;pointer-events:none;height:2px;width:140px;
         background:linear-gradient(90deg,#fff,rgba(255,110,180,.6),transparent);
         border-radius:2px;filter:drop-shadow(0 0 6px #fff);animation:shootFly linear forwards}
  @keyframes shootFly{0%{opacity:0;transform:translate(0,0) rotate(28deg) scaleX(.2)}
         12%{opacity:1}100%{opacity:0;transform:translate(60vw,46vh) rotate(28deg) scaleX(1)}}

  /* Cursor glow + spark trail */
  #cursorGlow{position:fixed;width:300px;height:300px;border-radius:50%;z-index:8;pointer-events:none;
              transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,45,158,.18),transparent 60%);
              transition:opacity .4s;mix-blend-mode:screen}
  .spark{position:fixed;z-index:9;pointer-events:none;border-radius:50%;background:#fff;
         box-shadow:0 0 8px #ff6eb4,0 0 14px #ff2d9e;animation:sparkFade .9s ease-out forwards}
  @keyframes sparkFade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.1) translateY(14px)}}

  /* Firework particles */
  .fw{position:fixed;z-index:7;pointer-events:none;border-radius:50%;animation:fwBurst .95s ease-out forwards}
  @keyframes fwBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

  /* Title now gets a shimmering sweep */
  #screen1 .big-title{position:relative}
  #screen1 .big-title::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
         background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
         animation:shine 3.5s linear infinite;pointer-events:none}
  @keyframes shine{0%{background-position:200% 0}100%{background-position:-120% 0}}

  /* Entrance pops for card pieces */
  #screen3 .love-card>*{animation:popIn .7s cubic-bezier(.34,1.56,.64,1) backwards}
  #screen3 .love-card>*:nth-child(1){animation-delay:.05s}
  #screen3 .love-card>*:nth-child(2){animation-delay:.18s}
  #screen3 .love-card>*:nth-child(3){animation-delay:.31s}
  #screen3 .love-card>*:nth-child(4){animation-delay:.44s}
  #screen3 .love-card>*:nth-child(5){animation-delay:.57s}
  #screen3 .love-card>*:nth-child(6){animation-delay:.70s}
  #screen3 .love-card>*:nth-child(7){animation-delay:.83s}
  @keyframes popIn{0%{opacity:0;transform:translateY(22px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}

  /* Glowing animated ring around floating photos */
  .float-photo::before{content:'';position:absolute;inset:-4px;border-radius:18px;z-index:-1;
         background:linear-gradient(130deg,#ff2d9e,#9b00ff,#ff6eb4,#ff2d9e);background-size:300% 300%;
         filter:blur(7px);opacity:.8;animation:ringFlow 5s linear infinite}
  @keyframes ringFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  /* Music toggle button */
  #musicBtn{position:fixed;top:16px;right:16px;z-index:200;width:46px;height:46px;border-radius:50%;
            border:2px solid #ff2d9e;background:rgba(255,45,158,.18);color:#fff;font-size:20px;cursor:pointer;
            backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 16px rgba(255,45,158,.5);transition:transform .25s,background .25s}
  #musicBtn:hover{transform:scale(1.1);background:rgba(255,45,158,.4)}
  #musicBtn.playing{animation:musicSpin 4s linear infinite}
  #musicBtn.muted{opacity:.55;border-color:rgba(255,255,255,.4);box-shadow:none}
  @keyframes musicSpin{to{transform:rotate(360deg)}}

  /* 3D rotating photo sphere */
  #sphereStage{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;
               perspective:1200px;cursor:grab;touch-action:none}
  #sphereStage.on{display:flex}
  #sphereStage:active{cursor:grabbing}
  #sphere{position:relative;width:0;height:0;transform-style:preserve-3d;will-change:transform}
  .orb-photo{position:absolute;width:118px;height:148px;margin:-74px 0 0 -59px;border-radius:14px;overflow:hidden;
             border:2px solid rgba(255,140,210,.85);box-shadow:0 0 18px rgba(255,45,158,.55),0 0 36px rgba(155,0,255,.3);
             backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .orb-photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .orb-photo::after{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 22px rgba(120,0,180,.45)}
  #sphereHint{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.85);
              font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(13px,3.4vw,18px);letter-spacing:1.5px;
              text-shadow:0 0 14px rgba(255,45,158,.9);pointer-events:none;animation:hintPulse 2s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="aura"></div>
<div id="beams"><div class="beam b1"></div><div class="beam b2"></div></div>
<div id="vignette"></div>
<div id="cursorGlow"></div>
<audio src="./assets/music.mp3">
<button id="musicBtn" title="Bật/tắt nhạc" aria-label="Bật hoặc tắt nhạc nền">♪</button>
<div id="sphereStage"><div id="sphere"></div><p id="sphereHint">✋ Kéo để xoay quả cầu ảnh</p></div>
<div class="screen active" id="screen1">
  <div class="big-title">Ngày<br>Quốc Tế<br>Thiếu Nhi</div>
  <p class="subtitle">'Cả kiếp này anh có được em là siêu đẳng cấp rồi'</p>
  <button class="tap-btn" onclick="goToScreen2()">💝 Mở quà của em 💝</button>
</div>
<div class="screen" id="screen2">
  <div class="msg-overlay"><p>✨ TAY TRONG TAY ĐƯA EM ĐI NƠI HOÀNG HÔN TỚI ✨</p></div>
</div>
<div class="screen" id="screen3">
  <div class="love-card">
    <span class="heart-big">💝</span>
    <h2>Em Xinh Ngoan</h2>
    <p>AAA em xinh ngoan</p>
    <p>Yêu em số 1 trên thế giới 🌸</p>
    <p>Chúc em ngày Quốc Tế Thiếu Nhi thật vui!</p>
    <p style="margin-top:12px;font-size:clamp(12px,2.6vw,14px);color:rgba(255,200,255,.6)">Là ngày thế giới mất hai nỗi buồn<br>vì có em ở đây ♡</p>
    <button class="restart-btn" onclick="restart()">🔄 Xem lại từ đầu</button>
  </div>
</div>
<div id="lyricBar"><p id="lyricText">✨ Là ngày thế giới mất hai nỗi buồn ✨</p></div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight});
const COLS=['#ff2d9e','#c92fff','#9b00ff','#ff6eb4','#fff','#e040fb','#b39ddb'];
class P{constructor(init){this.reset(init)}reset(init){this.x=Math.random()*W;this.y=init?Math.random()*H:H+5;this.size=Math.random()*2+.3;this.vy=Math.random()*.45+.1;this.vx=(Math.random()-.5)*.28;this.base=Math.random()*.85+.15;this.color=COLS[Math.floor(Math.random()*COLS.length)];this.phase=Math.random()*Math.PI*2;this.sp=Math.random()*.04+.01}update(){this.y-=this.vy;this.x+=this.vx;this.phase+=this.sp;this.alpha=this.base*(.55+.45*Math.sin(this.phase));if(this.y<-5)this.reset(false)}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=this.color;ctx.globalAlpha=this.alpha;ctx.fill();ctx.globalAlpha=1}}
const pts=Array.from({length:340},(_,i)=>new P(true));
function loop(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#030008';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.6,0,W*.5,H*.6,W*.55);g.addColorStop(0,'rgba(110,0,170,.09)');g.addColorStop(.5,'rgba(70,0,110,.05)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);pts.forEach(p=>{p.update();p.draw()});requestAnimationFrame(loop)}
loop();

/* ===== 3D PHOTO SPHERE ===== */
const stage=document.getElementById('sphereStage');
const sphere=document.getElementById('sphere');
let rotX=-12,rotY=0,autoSpin=true,dragging=false,lastX=0,lastY=0,velX=0,velY=0,sphereRAF=null,sphereTimer=null;

function buildSphere(){
  sphere.innerHTML='';
  const N=14, R=Math.min(window.innerWidth,window.innerHeight)*0.34+60;
  for(let i=0;i<N;i++){
    const phi=Math.acos(-1+(2*i)/N);                 // polar angle 0..PI
    const theta=Math.sqrt(N*Math.PI)*phi;            // golden-angle azimuth
    const x=Math.sin(phi)*Math.cos(theta);
    const y=Math.sin(phi)*Math.sin(theta);
    const z=Math.cos(phi);
    const yaw=Math.atan2(x,z)*180/Math.PI;
    const pitch=Math.atan2(y,Math.sqrt(x*x+z*z))*180/Math.PI;
    const card=document.createElement('div');
    card.className='orb-photo';
    card.style.transform=`rotateY(${yaw}deg) rotateX(${-pitch}deg) translateZ(${R}px)`;
    const img=document.createElement('img');
    img.src=IMAGES[i%IMAGES.length];
    img.crossOrigin='anonymous';
    card.appendChild(img);
    sphere.appendChild(card);
  }
  stage.classList.add('on');
  autoSpin=true;velX=0;velY=0;
  cancelAnimationFrame(sphereRAF);
  spinLoop();
}
function spinLoop(){
  if(!dragging){
    if(autoSpin){rotY+=0.18;rotX+=Math.sin(Date.now()/2600)*0.04;}
    else{rotY+=velY;rotX+=velX;velY*=0.94;velX*=0.94;if(Math.abs(velY)<0.02&&Math.abs(velX)<0.02)autoSpin=true;}
  }
  rotX=Math.max(-80,Math.min(80,rotX));
  sphere.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  sphereRAF=requestAnimationFrame(spinLoop);
}
function clearSphere(){stage.classList.remove('on');cancelAnimationFrame(sphereRAF);sphereRAF=null;clearTimeout(sphereTimer);sphere.innerHTML=''}

/* Drag to rotate (mouse + touch) */
function dragStart(x,y){dragging=true;autoSpin=false;lastX=x;lastY=y;velX=velY=0}
function dragMove(x,y){if(!dragging)return;const dx=x-lastX,dy=y-lastY;rotY+=dx*0.3;rotX-=dy*0.3;velY=dx*0.3;velX=-dy*0.3;lastX=x;lastY=y}
function dragEnd(){dragging=false}
stage.addEventListener('mousedown',e=>{dragStart(e.clientX,e.clientY)});
window.addEventListener('mousemove',e=>dragMove(e.clientX,e.clientY));
window.addEventListener('mouseup',dragEnd);
stage.addEventListener('touchstart',e=>{const t=e.touches[0];dragStart(t.clientX,t.clientY)},{passive:true});
stage.addEventListener('touchmove',e=>{const t=e.touches[0];dragMove(t.clientX,t.clientY)},{passive:true});
stage.addEventListener('touchend',dragEnd);

/* ===== BACKGROUND MUSIC ===== */
const bgm=document.getElementById('bgm');const musicBtn=document.getElementById('musicBtn');
let musicOn=true;bgm.volume=0.55;
function tryPlayMusic(){if(!musicOn)return;bgm.play().then(()=>{musicBtn.classList.add('playing');musicBtn.classList.remove('muted');musicBtn.textContent='♪'}).catch(()=>{})}
musicBtn.addEventListener('click',e=>{e.stopPropagation();musicOn=!musicOn;if(musicOn){tryPlayMusic()}else{bgm.pause();musicBtn.classList.remove('playing');musicBtn.classList.add('muted');musicBtn.textContent='✕'}});

function spawnHearts(){
  const em=['💕','💖','💗','💝','✨','🌸','🌺'];
  for(let i=0;i<14;i++)setTimeout(()=>{const h=document.createElement('div');h.className='heart-particle';h.textContent=em[Math.floor(Math.random()*em.length)];h.style.left=Math.random()*100+'vw';h.style.bottom='0';h.style.fontSize=(13+Math.random()*22)+'px';h.style.animationDuration=(3.5+Math.random()*3.5)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8000)},i*380);
}
setInterval(()=>{if(cur!==1)spawnHearts()},5500);

const LYR=['✨ Là ngày thế giới mất hai nỗi buồn ✨','💕 Tay trong tay đưa em đi nơi hoàng hôn tới 💕','🌸 Cả kiếp này anh có được em là siêu đẳng cấp rồi 🌸','💝 AAA em xinh ngoan — Yêu em số 1 trên thế giới 💝','✨ Quốc tế thiếu nhi tặng em tất cả yêu thương ✨','🌺 Mãi mãi bên em dù ngàn năm có trôi qua 🌺'];
let li=0;
function rotateLyrics(){const el=document.getElementById('lyricText');setInterval(()=>{el.style.opacity='0';setTimeout(()=>{li=(li+1)%LYR.length;el.textContent=LYR[li];el.style.opacity='1'},400)},3600)}
rotateLyrics();

/* ===== NEW EFFECTS JS ===== */
const PINK=['#ff2d9e','#c92fff','#9b00ff','#ff6eb4','#e040fb','#ffd1ec'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* Twinkling starfield (build once) */
(function stars(){const f=document.createDocumentFragment();for(let i=0;i<70;i++){const s=document.createElement('div');s.className='twinkle';const sz=Math.random()*2.5+1;s.style.width=s.style.height=sz+'px';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.animationDuration=(2+Math.random()*3)+'s';s.style.animationDelay=Math.random()*3+'s';f.appendChild(s)}document.body.appendChild(f)})();

/* Falling petals (continuous) */
function dropPetal(){const p=document.createElement('div');p.className='petal';const sz=8+Math.random()*12;p.style.width=sz+'px';p.style.height=sz+'px';p.style.left=Math.random()*100+'vw';p.style.background=`linear-gradient(135deg,${pick(PINK)},${pick(PINK)})`;p.style.animationDuration=(6+Math.random()*6)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),12000)}
setInterval(dropPetal,650);for(let i=0;i<8;i++)setTimeout(dropPetal,i*300);

/* Shooting stars */
function shoot(){const s=document.createElement('div');s.className='shoot';s.style.left=Math.random()*60+'vw';s.style.top=Math.random()*40+'vh';s.style.animationDuration=(1+Math.random()*.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}
setInterval(()=>{if(Math.random()<.7)shoot()},2600);

/* Cursor glow + spark trail */
const glow=document.getElementById('cursorGlow');let lastSpark=0;
function moveAt(x,y){glow.style.left=x+'px';glow.style.top=y+'px';const now=Date.now();if(now-lastSpark>45){lastSpark=now;const sp=document.createElement('div');sp.className='spark';const sz=3+Math.random()*4;sp.style.width=sp.style.height=sz+'px';sp.style.left=(x+(Math.random()-.5)*16)+'px';sp.style.top=(y+(Math.random()-.5)*16)+'px';document.body.appendChild(sp);setTimeout(()=>sp.remove(),900)}}
window.addEventListener('mousemove',e=>moveAt(e.clientX,e.clientY));
window.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)moveAt(t.clientX,t.clientY)},{passive:true});

/* Fireworks burst */
function firework(x,y){const n=26;for(let i=0;i<n;i++){const f=document.createElement('div');f.className='fw';const sz=4+Math.random()*4;f.style.width=f.style.height=sz+'px';f.style.left=x+'px';f.style.top=y+'px';const col=pick(PINK);f.style.background=col;f.style.boxShadow=`0 0 8px ${col},0 0 16px ${col}`;const ang=(Math.PI*2*i)/n,dist=70+Math.random()*90;f.style.setProperty('--dx',Math.cos(ang)*dist+'px');f.style.setProperty('--dy',Math.sin(ang)*dist+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}}
function fireworkShow(){let c=0;const t=setInterval(()=>{firework(innerWidth*(.2+Math.random()*.6),innerHeight*(.15+Math.random()*.45));if(++c>=6)clearInterval(t)},500)}

/* Click / tap anywhere = mini firework */
window.addEventListener('click',e=>{firework(e.clientX,e.clientY)});

/* Hook celebrations into the existing flow */
const _g2=goToScreen2;goToScreen2=function(){tryPlayMusic();_g2();for(let i=0;i<3;i++)setTimeout(()=>firework(innerWidth*Math.random(),innerHeight*.4*Math.random()+innerHeight*.1),i*260)};
const _g3=goToScreen3;goToScreen3=function(){_g3();fireworkShow()};
</script>
</body>
</html>
